[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodal-hindsight"
version = "0.1.0"
description = "Compile decision evidence and evaluate human-assisted decision systems"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3", "typer>=0.16,<1", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
hindsight = "nodal_hindsight.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/nodal_hindsight"]
